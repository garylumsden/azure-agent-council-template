name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/GovernanceCouncil.slnx

      - name: Build
        run: dotnet build src/GovernanceCouncil.slnx --no-restore -c Release

      - name: Audit vulnerable packages
        run: |
          dotnet list src/GovernanceCouncil.slnx package --vulnerable --include-transitive | tee audit.txt
          if grep -q 'has the following vulnerable packages' audit.txt; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi

      - name: Audit deprecated packages
        run: dotnet list src/GovernanceCouncil.slnx package --deprecated

  bicep:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the Bicep template
        run: az bicep build --file infra/main.bicep
